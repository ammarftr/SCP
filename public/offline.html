<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4B7A">
<title>Tidak Ada Koneksi</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F3F5F8;color:#1A2333;text-align:center;padding:1.5rem}
  .box{max-width:340px}
  h1{font-size:1.25rem;margin:0 0 .5rem}
  p{color:#66707E;margin:0 0 1.25rem}
  button{background:#1B4B7A;color:#fff;border:0;border-radius:8px;padding:.6rem 1.4rem;font-size:.95rem;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>Tidak ada koneksi internet</h1>
    <p>Sambungkan kembali ke internet, lalu coba lagi.</p>
    <button onclick="location.reload()">Muat ulang</button>
  </div>
</body>
</html>
